<style>
:root {
  --hl-bg: rgba(0,0,0,.045);
  --hl-bg2: rgba(0,0,0,.075);
  --hl-line: rgba(0,0,0,.12);
  --hl-muted: rgba(0,0,0,.52);
  --hl-top: 58px;          /* Platz für Titel und Vergrößern-Symbol der Symcon-Kachel */
}
/* Farben aus dem Modul „Visu Design“ (--w5-*); die Werte nach dem Komma gelten ohne Design-Instanz */
body {
  --hl-accent: var(--w5-accent, #2F6B4F);
  --hl-bad: var(--w5-alarm, #C8321F);
  --hl-on: var(--w5-on, #fff);
  --hl-fg: var(--w5-fg, #1E2224);
}
body.dark {
  --hl-accent: var(--w5-accent, #74B892);
  --hl-bad: var(--w5-alarm, #FF5A47);
  --hl-on: var(--w5-on, #1E2224);
  --hl-fg: var(--w5-fg, #F1F0EB);
  --hl-bg: rgba(255,255,255,.10);
  --hl-bg2: rgba(255,255,255,.15);
  --hl-line: rgba(255,255,255,.16);
  --hl-muted: rgba(255,255,255,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Poppins', 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.35; }
button { font: inherit; }
#hl, #hl div, #hl span, #hl b, #hl button { color: var(--hl-fg); }
#hl .lbl, #hl .sub, #hl .val { color: var(--hl-muted); }
#hl .seg button.on, #hl .badge, #hl .chip.on { color: var(--hl-on); }
#hl { position: absolute; inset: 0; padding: var(--hl-top) 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.lbl { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.sub { font-size: 12px; }
.val { font-size: 12px; font-variant-numeric: tabular-nums; }

/* Kopf */
.head { display: flex; align-items: center; gap: 14px; }
.lamp { width: 52px; height: 52px; border-radius: 50%; flex: none; background: var(--lc, #888); box-shadow: 0 0 0 4px var(--hl-bg2), 0 0 22px 2px var(--lg, transparent); transition: background .3s, box-shadow .3s; }
.lamp.off { background: var(--hl-line); box-shadow: 0 0 0 4px var(--hl-bg2); }
.head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.head .t b { font-size: 22px; font-weight: 500; line-height: 1.15; }
.badge { align-self: flex-start; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--hl-bad); }

/* Schalter */
.tg { position: relative; width: 56px; height: 32px; border-radius: 16px; background: var(--hl-line); border: 0; cursor: pointer; padding: 0; flex: none; touch-action: manipulation; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.tg.on { background: var(--hl-accent); }
.tg.on::after { left: 27px; }

/* Abschnitte */
.card { background: var(--hl-bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.card.dim { opacity: .55; }

/* Schieberegler mit Farbverlauf */
.sl { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; border-radius: 18px; margin: 0; background: var(--tr, var(--hl-bg2)); outline: none; cursor: pointer; touch-action: none; box-shadow: inset 0 0 0 1px var(--hl-line); }
.sl::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--th, #fff); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.sl::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--th, #fff); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.sl::-moz-range-track { background: transparent; }

/* Weiß / Farbe */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--hl-bg2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 38px; cursor: pointer; font-size: 13px; touch-action: manipulation; }
.seg button.on { background: var(--hl-accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 0; cursor: pointer; font-size: 12px; min-height: 34px; padding: 4px 12px 4px 6px; border-radius: 999px; background: var(--hl-bg2); touch-action: manipulation; }
.chip i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 8px; }
.sw button { aspect-ratio: 1; min-height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); touch-action: manipulation; }
.sw button.on { box-shadow: 0 0 0 3px var(--hl-fg); }
.btn { min-height: 36px; border: 1px solid var(--hl-line); background: none; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 13px; font-weight: 500; touch-action: manipulation; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
/* Szenen */
.sc { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.sc .chip { justify-content: flex-start; text-align: left; min-height: 40px; }
.sc .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.sel { box-shadow: inset 0 0 0 2px var(--hl-accent); }
#hl .btn.solid { background: var(--hl-accent); border-color: var(--hl-accent); color: var(--hl-on); font-weight: 600; }
#hl .msg { font-size: 12px; color: var(--hl-muted); }
.nw { display: flex; gap: 8px; align-items: center; }
.nw input { flex: 1; min-width: 0; font: inherit; font-size: 16px; min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--hl-line); background: var(--hl-bg2); color: var(--hl-fg); }
.nw input:focus { outline: none; border-color: var(--hl-accent); }

/* Regler-Knopf im Fenster: schließt es (zurück zur Seite mit dem Lampen-Button) */
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--hl-accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; touch-action: manipulation; }
#hl .ib, #hl .ib svg { color: var(--hl-on); }
.ib svg { width: 20px; height: 20px; }
/* kleine Kachel: Regler-Knopf, öffnet das Einstellungsfenster */
body.knob #hl { padding: 38px 8px 6px; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
.knobbtn { width: min(64px, 52vh); height: min(64px, 52vh); border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; background: var(--hl-bg2);
  box-shadow: 0 0 0 3px var(--lc, var(--hl-line)), 0 0 18px 0 var(--lg, transparent); touch-action: manipulation; }
.knobbtn svg { width: 55%; height: 55%; }
.knobbtn.off { box-shadow: 0 0 0 3px var(--hl-line); }
body.knob .val { font-size: 12px; }
body.short .knobval { display: none; }
@media (max-width: 420px) { #hl { padding-left: 12px; padding-right: 12px; } .card { padding: 12px; } }
</style>
<div id="hl"></div>
<script>
var HL = { s: null, busy: false, pending: false, tab: null, h: null, sat: null, last: 0, timer: null, confirm: '', newOpen: false, newVal: '' };
var KNOB_H = 260;
var TUNE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>';
var WHITES = [[2200, 'Kerze'], [2700, 'Warm'], [3000, 'Gemütlich'], [4000, 'Neutral'], [5000, 'Hell'], [6500, 'Tageslicht']];
var COLORS = [[0, 1], [25, 1], [45, 1], [60, .9], [120, 1], [175, 1], [210, 1], [240, 1], [275, 1], [300, 1], [330, .8], [20, .45]];

function design(css) {
  if (typeof css !== 'string') return;
  var st = document.getElementById('w5d');
  if (!st) { st = document.createElement('style'); st.id = 'w5d'; (document.head || document.body).appendChild(st); }
  if (st.textContent !== css) st.textContent = css;
}
function handleMessage(data) {
  try { HL.s = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
  design(HL.s.design);
  if (HL.busy) { HL.pending = true; return; }
  render();
}
function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
window.addEventListener('resize', function () { if (HL.s && !HL.busy) render(); });

/* Farben */
function hsv(h, s, v) {
  h = ((h % 360) + 360) % 360 / 60; var i = Math.floor(h), f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  var c = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return 'rgb(' + c.map(function (x) { return Math.round(x * 255); }).join(',') + ')';
}
function toHsv(n) {
  var r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: Math.round((h * 60 + 360) % 360), s: mx ? d / mx : 0 };
}
/* Farbtemperatur → RGB (Näherung nach Tanner Helland) */
function kelvinRgb(k) {
  var t = k / 100, r, g, b;
  r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
  g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
  b = t >= 66 ? 255 : t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04;
  return 'rgb(' + [r, g, b].map(function (x) { return Math.round(Math.max(0, Math.min(255, x))); }).join(',') + ')';
}
function lampColor(s) {
  if (s.mode === 1 || !s.hasColor) return s.kelvin ? kelvinRgb(s.kelvin) : '#FFE7B0';
  var c = s.color || 0xFFFFFF;
  return '#' + ('00000' + c.toString(16)).slice(-6);
}
function pct(b) { return Math.max(1, Math.round((b || 0) / 254 * 100)); }

/* Hell/Dunkel wie die übrigen Kacheln: Schriftfarbe der Visu, sonst Systemeinstellung */
function theme() {
  var b = document.body, m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(getComputedStyle(b).color || ''), dark;
  if (m) dark = (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255 > 0.5;
  else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  b.classList.toggle('dark', dark);
}
function canOpen() { return typeof openObject === 'function' && HL.s && (HL.s.detailId > 0 || HL.s.hueId > 0); }

function render() {
  var s = HL.s, el = document.getElementById('hl');
  if (!s) return;
  theme();
  var knob = window.innerHeight < KNOB_H && canOpen();
  document.body.classList.toggle('knob', knob);
  document.body.classList.toggle('short', window.innerHeight < 120);
  if (!s.ok) { el.innerHTML = '<div class="sub">Keine Hue-Instanz ausgewählt.</div>'; return; }
  var lc = lampColor(s), on = s.on && s.reachable;
  el.style.setProperty('--lc', lc);
  el.style.setProperty('--lg', on ? lc : 'transparent');

  if (knob) {
    el.innerHTML = '<button class="knobbtn' + (on ? '' : ' off') + '" id="open" aria-label="Einstellungen ' + esc(s.name) + '" title="Einstellungen">' + TUNE + '</button>'
      + '<span class="val knobval">' + (!s.reachable ? 'nicht erreichbar' : on ? (s.hasBri ? pct(s.bri) + ' %' : 'An') : 'Aus') + '</span>';
    document.getElementById('open').onclick = function () { try { openObject(s.detailId > 0 ? s.detailId : s.hueId); } catch (e) { /* nichts */ } };
    return;
  }

  var tab = HL.tab || (s.hasColor && (s.mode === 0 || !s.hasCt) ? 'color' : 'white');
  if (tab === 'color' && !s.hasColor) tab = 'white';
  if (tab === 'white' && !s.hasCt) tab = 'color';
  var cur = toHsv(s.color || 0xFFFFFF);
  if (HL.h === null || !HL.busy) { HL.h = cur.h; HL.sat = cur.s; }

  var h = '<div class="head"><div class="lamp' + (on ? '' : ' off') + '"></div><div class="t"><b>' + (on ? 'An' : 'Aus') + (on && s.hasBri ? ' · ' + pct(s.bri) + ' %' : '') + '</b>'
    + '<span class="sub">' + (on ? (s.mode === 1 || !s.hasColor ? (s.kelvin ? s.kelvin + ' K' : '') : 'Farbe') + (s.effect === 'colorloop' ? ' · Farbschleife' : '') : esc(s.name)) + '</span>'
    + (s.reachable ? '' : '<span class="badge">nicht erreichbar</span>') + '</div>'
    + '<button class="tg' + (s.on ? ' on' : '') + '" id="pw" role="switch" aria-checked="' + !!s.on + '" aria-label="Ein/Aus"></button>'
    + (s.backId > 0 && typeof openObject === 'function' ? '<button class="ib" id="back" aria-label="Schließen, zurück zur Seite" title="Schließen">' + TUNE + '</button>' : '')
    + '</div>';

  h += sceneCard(s);
  if (s.hasBri) {
    h += '<div class="card"><div class="row"><span class="lbl">Helligkeit</span><span class="val" id="vb">' + pct(s.bri) + ' %</span></div>'
      + '<input class="sl" type="range" id="bri" min="1" max="254" value="' + (s.bri || 1) + '" aria-label="Helligkeit" style="--tr:linear-gradient(90deg,#222,' + lc + ');--th:' + lc + '"></div>';
  }
  if (s.hasColor || s.hasCt) {
    h += '<div class="card">';
    if (s.hasColor && s.hasCt) h += '<div class="seg"><button data-tab="white" class="' + (tab === 'white' ? 'on' : '') + '">Weiß</button><button data-tab="color" class="' + (tab === 'color' ? 'on' : '') + '">Farbe</button></div>';
    if (tab === 'white') {
      var k = s.kelvin || 2700, grad = [];
      for (var i = 0; i <= 6; i++) grad.push(kelvinRgb(s.kmin + (s.kmax - s.kmin) * i / 6));
      h += '<div class="row"><span class="lbl">Farbtemperatur</span><span class="val" id="vk">' + k + ' K</span></div>'
        + '<input class="sl" type="range" id="kel" min="' + s.kmin + '" max="' + s.kmax + '" step="50" value="' + k + '" aria-label="Farbtemperatur" style="--tr:linear-gradient(90deg,' + grad.join(',') + ');--th:' + kelvinRgb(k) + '">'
        + '<div class="chips">';
      WHITES.forEach(function (w) {
        if (w[0] < s.kmin - 50 || w[0] > s.kmax + 50) return;
        var act = s.mode === 1 && Math.abs(k - w[0]) < 60;
        h += '<button class="chip' + (act ? ' on' : '') + '" data-k="' + w[0] + '" style="' + (act ? 'background:var(--hl-accent)' : '') + '"><i style="--c:' + kelvinRgb(w[0]) + '"></i>' + w[1] + '</button>';
      });
      h += '</div>';
    } else {
      var hues = [];
      for (var j = 0; j <= 12; j++) hues.push(hsv(j * 30, 1, 1));
      h += '<div class="row"><span class="lbl">Farbton</span><span class="val" id="vh">' + HL.h + '°</span></div>'
        + '<input class="sl" type="range" id="hue" min="0" max="359" value="' + HL.h + '" aria-label="Farbton" style="--tr:linear-gradient(90deg,' + hues.join(',') + ');--th:' + hsv(HL.h, 1, 1) + '">'
        + '<div class="row"><span class="lbl">Sättigung</span><span class="val" id="vs">' + Math.round(HL.sat * 100) + ' %</span></div>'
        + '<input class="sl" type="range" id="sat" min="0" max="100" value="' + Math.round(HL.sat * 100) + '" aria-label="Sättigung" style="--tr:linear-gradient(90deg,#fff,' + hsv(HL.h, 1, 1) + ');--th:' + hsv(HL.h, HL.sat, 1) + '">'
        + '<div class="sw">';
      COLORS.forEach(function (c) {
        var act = s.mode === 0 && Math.abs(cur.h - c[0]) < 6 && Math.abs(cur.s - c[1]) < .08;
        h += '<button class="' + (act ? 'on' : '') + '" data-h="' + c[0] + '" data-s="' + c[1] + '" style="--c:' + hsv(c[0], c[1], 1) + '" aria-label="Farbe ' + c[0] + '°"></button>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  h += '<div class="card"><span class="lbl">Effekte</span>';
  if (s.hasColor) h += '<div class="row"><div class="t"><span>Farbschleife</span><div class="sub">läuft durch alle Farben, bis sie ausgeschaltet wird</div></div><button class="tg' + (s.effect === 'colorloop' ? ' on' : '') + '" id="loop" role="switch" aria-label="Farbschleife"></button></div>';
  h += '<div class="acts"><button class="btn" data-alert="select">Einmal blinken</button><button class="btn" data-alert="lselect">15 s blinken</button><button class="btn" data-alert="none">Blinken stoppen</button></div></div>';
  el.innerHTML = h;
  bind();
}

/* Szenen der Hue-Bridge: abrufen, aktuellen Zustand in die gewählte Szene speichern, neue Szene anlegen */
function prefix(list) {
  // gemeinsamen Raumnamen („Büro “) in den Knöpfen weglassen
  if (list.length < 2) return '';
  var p = list[0].name.split(' ')[0] + ' ';
  return list.every(function (x) { return x.name.indexOf(p) === 0 && x.name.length > p.length; }) ? p : '';
}
function sceneSwatch(x) {
  if (!x.on) return 'var(--hl-line)';
  return x.color !== null ? '#' + ('00000' + x.color.toString(16)).slice(-6) : kelvinRgb(x.kelvin || 2700);
}
function sceneCard(s) {
  if (!s.paired) return '<div class="card"><span class="lbl">Szenen</span><span class="msg">Noch nicht mit der Hue-Bridge verbunden: in der Konsole an der Instanz „Mit Bridge verbinden“ (vorher Link-Taste der Bridge drücken).</span></div>';
  var list = s.scenes || [], p = prefix(list), sel = null;
  list.forEach(function (x) { if (x.id === s.sceneSel) sel = x; });
  var act = list.filter(function (x) { return x.active; });
  if (!sel && act.length) sel = act[0];
  var h = '<div class="card"><div class="row"><span class="lbl">Szenen</span><span class="val">' + (act.length ? esc(act[0].name.slice(p.length)) : 'keine aktiv') + '</span></div><div class="sc">';
  list.forEach(function (x) {
    h += '<button class="chip' + (x.active ? ' on' : '') + (sel && sel.id === x.id && !x.active ? ' sel' : '') + '" data-scene="' + esc(x.id) + '" style="' + (x.active ? 'background:var(--hl-accent)' : '') + '"><i style="--c:' + sceneSwatch(x) + '"></i><span>' + esc(x.name.slice(p.length)) + '</span></button>';
  });
  h += '</div>';
  if (!list.length) h += '<span class="msg">Keine Szenen mit dieser Lampe gefunden.</span>';
  if (HL.confirm && sel && HL.confirm === sel.id) {
    h += '<div class="row"><span class="msg">„' + esc(sel.name) + '“ mit dem aktuellen Zustand dieser Lampe überschreiben?</span><div class="acts"><button class="btn" data-sc-no="1">Abbrechen</button><button class="btn solid" data-sc-yes="' + esc(sel.id) + '">Speichern</button></div></div>';
  } else if (HL.newOpen) {
    h += '<div class="nw"><input id="nwn" type="text" maxlength="32" autocomplete="off" placeholder="Name der neuen Szene" value="' + esc(HL.newVal) + '" aria-label="Name der neuen Szene"><button class="btn solid" id="nwok">Anlegen</button></div>'
      + '<div class="row"><span class="msg">Übernimmt den aktuellen Zustand aller Lampen im Raum.</span><button class="btn" id="nwno">Abbrechen</button></div>';
  } else {
    h += '<div class="acts">' + (sel ? '<button class="btn" data-sc-save="' + esc(sel.id) + '">In „' + esc(sel.name.slice(p.length)) + '“ speichern</button>' : '') + '<button class="btn" id="nwopen">Neue Szene</button></div>';
  }
  if (s.sceneMsg) h += '<span class="msg">' + esc(s.sceneMsg) + '</span>';
  return h + '</div>';
}
function bindScenes() {
  document.querySelectorAll('[data-scene]').forEach(function (b) { b.onclick = function () { HL.confirm = ''; send('Scene', b.getAttribute('data-scene')); }; });
  document.querySelectorAll('[data-sc-save]').forEach(function (b) {
    b.onclick = function () { HL.confirm = b.getAttribute('data-sc-save'); render(); setTimeout(function () { if (HL.confirm) { HL.confirm = ''; render(); } }, 8000); };
  });
  document.querySelectorAll('[data-sc-yes]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-sc-yes'); HL.confirm = ''; send('SceneSave', id); render(); }; });
  document.querySelectorAll('[data-sc-no]').forEach(function (b) { b.onclick = function () { HL.confirm = ''; render(); }; });
  var o = document.getElementById('nwopen');
  if (o) o.onclick = function () { HL.newOpen = true; HL.newVal = ''; render(); var i = document.getElementById('nwn'); if (i) i.focus(); };
  var inp = document.getElementById('nwn');
  if (inp) {
    inp.onfocus = function () { HL.busy = true; };
    inp.onblur = function () { HL.busy = false; HL.newVal = inp.value; if (HL.pending) { HL.pending = false; setTimeout(render, 200); } };
    inp.oninput = function () {
      // Hue erlaubt höchstens 32 Byte (UTF-8), Umlaute zählen doppelt
      while (inp.value && unescape(encodeURIComponent(inp.value)).length > 32) inp.value = inp.value.slice(0, -1);
      HL.newVal = inp.value;
    };
    inp.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('nwok').click(); };
  }
  var ok = document.getElementById('nwok');
  if (ok) ok.onclick = function () { var n = (HL.newVal || '').trim(); if (!n) return; HL.newOpen = false; HL.busy = false; send('SceneNew', n); render(); };
  var no = document.getElementById('nwno');
  if (no) no.onclick = function () { HL.newOpen = false; HL.busy = false; render(); };
}

/* Regler: während des Ziehens höchstens alle 350 ms senden, beim Loslassen den Endwert */
function slider(id, onMove, onSend) {
  var r = document.getElementById(id);
  if (!r) return;
  var start = function () { HL.busy = true; };
  r.addEventListener('pointerdown', start);
  r.addEventListener('touchstart', start, { passive: true });
  r.addEventListener('input', function () {
    HL.busy = true;
    onMove(+r.value, r);
    var now = Date.now();
    clearTimeout(HL.timer);
    if (now - HL.last > 350) { HL.last = now; onSend(+r.value); }
    else HL.timer = setTimeout(function () { HL.last = Date.now(); onSend(+r.value); }, 350);
  });
  r.addEventListener('change', function () {
    clearTimeout(HL.timer); HL.last = Date.now(); onSend(+r.value);
    setTimeout(function () { HL.busy = false; if (HL.pending) { HL.pending = false; render(); } }, 600);
  });
}
function bind() {
  var s = HL.s;
  bindScenes();
  document.getElementById('pw').onclick = function () { send('State', !s.on); };
  var bk = document.getElementById('back');
  if (bk) bk.onclick = function () { try { openObject(s.backId); } catch (e) { /* nichts */ } };
  slider('bri', function (v) { document.getElementById('vb').textContent = pct(v) + ' %'; }, function (v) { send('Brightness', v); });
  slider('kel', function (v, r) { document.getElementById('vk').textContent = v + ' K'; r.style.setProperty('--th', kelvinRgb(v)); }, function (v) { send('Kelvin', v); });
  var color = function () { send('Color', JSON.stringify({ h: HL.h, s: HL.sat })); };
  slider('hue', function (v, r) {
    HL.h = v; document.getElementById('vh').textContent = v + '°'; r.style.setProperty('--th', hsv(v, 1, 1));
    var sr = document.getElementById('sat'); sr.style.setProperty('--tr', 'linear-gradient(90deg,#fff,' + hsv(v, 1, 1) + ')'); sr.style.setProperty('--th', hsv(v, HL.sat, 1));
  }, color);
  slider('sat', function (v, r) { HL.sat = v / 100; document.getElementById('vs').textContent = v + ' %'; r.style.setProperty('--th', hsv(HL.h, HL.sat, 1)); }, color);
  document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { HL.tab = b.getAttribute('data-tab'); render(); }; });
  document.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { send('Kelvin', +b.getAttribute('data-k')); }; });
  document.querySelectorAll('[data-h]').forEach(function (b) {
    b.onclick = function () { HL.h = +b.getAttribute('data-h'); HL.sat = +b.getAttribute('data-s'); send('Color', JSON.stringify({ h: HL.h, s: HL.sat })); };
  });
  var lp = document.getElementById('loop');
  if (lp) lp.onclick = function () { send('Effect', s.effect === 'colorloop' ? 'none' : 'colorloop'); };
  document.querySelectorAll('[data-alert]').forEach(function (b) { b.onclick = function () { send('Alert', b.getAttribute('data-alert')); }; });
}
</script>
